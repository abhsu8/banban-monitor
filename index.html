<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<meta name="referrer" content="no-referrer" />
<title>伴伴監控</title>
<!--
  B-055（D-60）：Founder 的遠端監控網頁外殼。這個檔案放在公開的 GitHub Pages（P-37），所以裡面沒有任何資料與密碼；
  資料只從 Edge Function monitor 拿（要先用密碼換通行證）。https://tmbfdhywqvmrzvfaijxb.supabase.co 由 scripts/monitor-web/publish.sh 換成 Supabase 的網址。
-->
<style>
  :root { --bg: #f6f4f1; --card: #fff; --text: #22201d; --muted: #6f6a63; --line: #e4dfd8; --accent: #2f6fde; --now: #e8f0ff; --warn: #b3541e; }
  @media (prefers-color-scheme: dark) { :root { --bg: #161513; --card: #211f1c; --text: #f1ede8; --muted: #a39d95; --line: #35322d; --accent: #7aa7ff; --now: #1f2b44; --warn: #f0995f; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  header { position: sticky; top: 0; z-index: 2; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 16px; display: flex; gap: 8px; align-items: center; }
  header h1 { font-size: 18px; margin: 0; flex: 1; }
  main { padding: 12px 16px 40px; max-width: 900px; margin: 0 auto; }
  button { font: inherit; border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 10px; padding: 6px 12px; }
  button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin: 12px 0; }
  h2 { font-size: 20px; margin: 0 0 4px; }
  h3 { font-size: 16px; margin: 16px 0 8px; }
  .muted { color: var(--muted); font-size: 14px; }
  .warn { color: var(--warn); }
  .pages { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .page { border: 2px solid transparent; border-radius: 10px; padding: 4px; background: var(--bg); }
  .page.now { border-color: var(--accent); background: var(--now); }
  .page .imgs { display: flex; gap: 2px; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 6px; background: #000; }
  .page img { flex: 1; min-width: 0; height: 100%; object-fit: cover; display: block; }
  .page .cap { font-size: 12px; color: var(--muted); padding: 2px 2px 0; }
  .tag { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 6px; background: var(--accent); color: #fff; }
  .listen { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .listen:first-child { border-top: 0; }
  .listen img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; background: #000; flex: none; }
  .listen .ph { width: 72px; height: 72px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 28px; flex: none; }
  .listen audio, .listen video { width: 100%; max-width: 320px; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  td { padding: 6px 4px; border-top: 1px solid var(--line); vertical-align: top; }
  td.t { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .login { max-width: 360px; margin: 18vh auto 0; }
  .login input { width: 100%; font: inherit; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); margin: 8px 0; }
  .login button { width: 100%; padding: 10px; }
  details summary { cursor: pointer; color: var(--accent); font-size: 14px; margin-top: 8px; }
  /* D-61 ②：隱藏的入口收在右下角的「⋯」，點了才出現選項，再確認一次 */
  .cell { position: relative; flex: 1; min-width: 0; height: 100%; }
  .cell img { width: 100%; }
  .cell.off img { opacity: .35; }
  .cell .off-tag { position: absolute; left: 4px; top: 4px; font-size: 11px; padding: 0 5px; border-radius: 5px; background: rgba(0,0,0,.6); color: #fff; }
  button.more { position: absolute; right: 3px; bottom: 3px; width: 26px; height: 20px; padding: 0; border: 0; border-radius: 6px; background: rgba(0,0,0,.35); color: #fff; font-size: 13px; line-height: 20px; letter-spacing: 1px; }
  .listen { position: relative; padding-right: 30px; }
  .listen button.more { background: transparent; color: var(--muted); bottom: 6px; right: 0; }
  .sheet-bg { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.4); display: flex; align-items: flex-end; justify-content: center; }
  .sheet { width: 100%; max-width: 480px; background: var(--card); color: var(--text); border-radius: 16px 16px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); }
  .sheet .who { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .sheet .who img, .sheet .who .ph { width: 56px; height: 56px; border-radius: 8px; object-fit: cover; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: 24px; flex: none; }
  .sheet button { display: block; width: 100%; padding: 12px; margin-top: 8px; font-size: 16px; }
  .sheet button.danger { background: var(--warn); border-color: var(--warn); color: #fff; }
  .sheet p { margin: 0 0 4px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .seg button { border: 0; border-radius: 0; font-size: 14px; }
  .seg button.on { background: var(--accent); color: #fff; }
  .bar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 2px 8px; align-items: center; font-size: 14px; padding: 3px 0; }
  .bar .track { grid-column: 1 / -1; height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 3px; }
  .bar.missed .fill { background: var(--warn); }
  .bar b { font-variant-numeric: tabular-nums; }
  .journey { border-top: 1px solid var(--line); padding: 6px 0; }
  .journey > summary { color: var(--text); font-size: 14px; margin: 0; list-style: none; }
  .journey > summary::-webkit-details-marker { display: none; }
  .journey .path { font-size: 13px; color: var(--muted); margin: 6px 0 2px; line-height: 1.9; }
  .chip { display: inline-block; font-size: 12px; padding: 0 6px; border-radius: 6px; border: 1px solid var(--line); margin-left: 4px; white-space: nowrap; }
  .chip.good { border-color: var(--accent); color: var(--accent); }
  .chip.bad { border-color: var(--warn); color: var(--warn); }
  .step { white-space: nowrap; }
  .step.scr { color: var(--text); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const API = "https://tmbfdhywqvmrzvfaijxb.supabase.co/functions/v1/monitor";
const TOKEN_KEY = "banban-monitor-token";
const app = document.getElementById("app");
const store = {
  get() { try { return localStorage.getItem(TOKEN_KEY); } catch { return null; } },
  set(v) { try { v ? localStorage.setItem(TOKEN_KEY, v) : localStorage.removeItem(TOKEN_KEY); } catch {} },
};

// 畫面編號 → 名字（PRD 長輩端畫面）
const SCREENS = { S02: "準備中", S03: "歡迎", S04: "相框", "S04-night": "相框（晚上點亮）", "S04-options": "相框的選項", S05: "有新訊息", S06: "播放", S07: "播完", S08: "說話中", S09: "帶到了", S10: "想跟誰說話", S13: "睡覺時間到了", S14: "早安", S15: "播放訊息" };
// 按鈕名稱（平板上的 data-tap）→ 白話
const TARGETS = {
  "S04.round": "相框的圓鈕（找家人）", "S04.options.listen": "選項「播放訊息」", "S04.options.talk": "選項「聯繫家人」", "S04.options.close": "選項的關閉鈕（×）", "S04.options.outside": "選項以外的地方（收起選項）",
  "S05.play": "「播放」", "S07.end": "「結束」", "S07.talk": "「帶話給…」", "S07.replay_photo": "照片（再看一次）", "S07.replay_hint": "「點一下，可以再看一次」",
  "S08.done": "「說好了」", "S10.back": "「回到相框」", "S14.talk": "「跟家人說早安」", "S15.end": "「結束播放」", screen: "畫面（沒點到按鈕）", button: "按鈕",
};
const KIND = { photos: "照片", video: "影片", voice: "語音" };
// D-61 ①：功能排行與使用路徑的名字
const EVENT_NAMES = { announce_shown: "新分享宣布", play_completed: "看完／聽完一則", play_skipped: "跳過一則", record_sent: "說話送出（帶話給家人）", record_abandoned: "說話沒送出", listen_started: "開始播放訊息", listen_ended: "播放訊息結束", tap_invalid: "點了沒反應", prompt_repeated: "伴伴再提醒一次" };
const SWIPE_NAMES = { S04: "在相框左右滑", S06: "播放時左右滑", S15: "在播放訊息左右滑" };
const featureName = (code) => {
  if (code === "missed") return "點了沒反應（沒點到按鈕）";
  const [type, rest] = [code.slice(0, code.indexOf(":")), code.slice(code.indexOf(":") + 1)];
  if (type === "tap") return rest === "S10.person" ? "點「想跟誰說話」裡的家人" : rest === "screen" ? "點相框的照片（沒點到按鈕）" : `點${targetName(rest)}`;
  if (type === "swipe") return SWIPE_NAMES[rest] ?? `在 ${screenName(rest)} 左右滑`;
  return EVENT_NAMES[rest] ?? rest;
};
const triggerName = (t) => {
  if (t === "announce") return "家人傳來新分享";
  if (t === "swipe") return "阿嬤滑相框";
  if (t.startsWith("tap:")) return `阿嬤點了${targetName(t.slice(4))}`;
  if (t.startsWith("screen:")) return screenName(t.slice(7));
  return t;
};
const dur = (ms) => (ms < 60000 ? `${Math.max(1, Math.round(ms / 1000))} 秒` : `${Math.floor(ms / 60000)} 分 ${Math.round((ms % 60000) / 1000)} 秒`);
// 重新整理時保留：哪幾次使用是打開的、排行看 7 天還是 30 天
const ui = { open: new Set(), range: "d7" };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const tw = (iso, withDate = true) => iso ? new Intl.DateTimeFormat("zh-TW", { timeZone: "Asia/Taipei", hour12: false, ...(withDate ? { month: "2-digit", day: "2-digit" } : {}), hour: "2-digit", minute: "2-digit", second: "2-digit" }).format(new Date(iso)) : "—";
const ago = (iso) => {
  if (!iso) return "從來沒有";
  const s = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
  if (s < 90) return `${s} 秒前`;
  if (s < 5400) return `${Math.round(s / 60)} 分鐘前`;
  if (s < 172800) return `${Math.round(s / 3600)} 小時前`;
  return `${Math.round(s / 86400)} 天前`;
};
const screenName = (id) => (id ? `${SCREENS[id] ?? id}（${id}）` : "—");
const targetName = (t) => {
  if (!t) return "";
  const m = /^S10\.person\.(\d+)$/.exec(t);
  if (m) return `第 ${Number(m[1]) + 1} 位家人`;
  return TARGETS[t] ?? t;
};

function renderLogin(message) {
  app.innerHTML = `<form class="login card" id="f">
    <h2>伴伴監控</h2>
    <div class="muted">輸入監控密碼（只要輸入一次，這支手機會記住 30 天）</div>
    <input type="password" id="pw" autocomplete="current-password" placeholder="監控密碼" required />
    ${message ? `<div class="warn">${esc(message)}</div>` : ""}
    <button class="primary" type="submit">登入</button>
  </form>`;
  document.getElementById("f").onsubmit = async (e) => {
    e.preventDefault();
    const res = await fetch(`${API}/login`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ password: document.getElementById("pw").value }) }).catch(() => null);
    if (!res) return renderLogin("連不上伺服器，請稍後再試");
    if (res.status === 429) return renderLogin("密碼錯太多次，請 15 分鐘後再試");
    if (!res.ok) return renderLogin("密碼不對");
    store.set((await res.json()).token);
    load();
  };
}

function focusLabel(w, focus) {
  if (!focus) return "";
  const [id, idx] = focus.split(":");
  if (id === "default") return `預設照片 ${Number(idx) + 1}`;
  const m = w.focusMessages[id];
  if (!m) return "（已刪除的內容）";
  return `${esc(m.memberName ?? "家人")}的${KIND[m.kind] ?? ""}${m.kind === "photos" ? ` 第 ${Number(idx) + 1} 張` : ""}（${tw(m.sentAt)}）`;
}

// D-61 ②：右下角「⋯」→ 選項 → 再確認一次 → 隱藏／取消隱藏（不刪資料）。
// 不用瀏覽器的 confirm()：有些瀏覽器（例如 App 內建的瀏覽器）會直接擋掉，按了看起來沒反應。
const moreBtn = (key, hide, label, thumb) => `<button class="more" aria-label="更多" data-key="${esc(key)}" data-hide="${hide ? 1 : 0}" data-label="${esc(label)}" data-thumb="${esc(thumb ?? "")}">⋯</button>`;
let sheetOpen = false;

function openSheet(b) {
  const { key, label, thumb } = b.dataset;
  const hide = b.dataset.hide === "1";
  const bg = document.createElement("div");
  bg.className = "sheet-bg";
  const close = () => { bg.remove(); sheetOpen = false; };
  bg.onclick = (e) => { if (e.target === bg) close(); };
  const who = `<div class="who">${thumb ? `<img src="${esc(thumb)}" alt="" />` : `<div class="ph">🎙</div>`}<div>${esc(label)}</div></div>`;
  const step = (html, wire) => { bg.innerHTML = `<div class="sheet">${who}${html}</div>`; wire(); };
  const menu = () => step(
    `<button id="sh-act">${hide ? "從平板隱藏" : "取消隱藏"}</button><button id="sh-no">取消</button>`,
    () => { bg.querySelector("#sh-act").onclick = confirmStep; bg.querySelector("#sh-no").onclick = close; });
  const confirmStep = () => step(
    hide
      ? `<p><b>確定要從平板隱藏嗎？</b></p><p class="muted">平板大約一分鐘內就不再顯示（相框、播放訊息都不出現）。不刪資料、不通知家人，之後可以在「已隱藏」取消。</p><button id="sh-yes" class="danger">確定隱藏</button><button id="sh-no">不要</button>`
      : `<p><b>確定要取消隱藏嗎？</b></p><p class="muted">平板下次同步（大約一分鐘內）就會再顯示。</p><button id="sh-yes" class="primary">確定取消隱藏</button><button id="sh-no">不要</button>`,
    () => { bg.querySelector("#sh-yes").onclick = send; bg.querySelector("#sh-no").onclick = close; });
  const send = async () => {
    step(`<p>處理中…</p>`, () => {});
    const [messageId, idx] = key.split(":");
    const res = await fetch(`${API}/hide`, { method: "POST", headers: { "content-type": "application/json", authorization: `Bearer ${store.get()}` }, body: JSON.stringify({ messageId, idx: Number(idx), hidden: hide }) }).catch(() => null);
    if (res && res.status === 401) { close(); store.set(null); return renderLogin("請重新登入"); }
    const msg = !res ? "連不上伺服器，請稍後再試" : !res.ok ? `沒有成功（${res.status}），請重新整理再試一次` : hide ? "已隱藏。平板大約一分鐘內就不再顯示。" : "已取消隱藏。平板大約一分鐘內就會再顯示。";
    step(`<p>${esc(msg)}</p><button id="sh-ok" class="primary">好</button>`, () => { bg.querySelector("#sh-ok").onclick = close; });
    if (res && res.ok) load();
  };
  sheetOpen = true;
  document.body.appendChild(bg);
  menu();
}

app.addEventListener("click", (e) => {
  const b = e.target.closest("button.more");
  if (b) return void openSheet(b);
  const r = e.target.closest(".seg button");
  if (r) { ui.range = r.dataset.range; load(); }
});
app.addEventListener("toggle", (e) => {
  const d = e.target;
  if (!d.classList || !d.classList.contains("journey")) return;
  d.open ? ui.open.add(d.dataset.key) : ui.open.delete(d.dataset.key);
}, true);

function renderWindow(w) {
  const d = w.device;
  const dev = d
    ? `<div>最後上線：<b>${ago(d.lastSeenAt)}</b> <span class="muted">${tw(d.lastSeenAt)}</span></div>
       <div>現在的畫面：<b>${esc(screenName(d.screen))}</b></div>
       <div class="muted">電量 ${d.batteryPct ?? "—"}%${d.charging ? "（充電中）" : d.charging === false ? '<span class="warn">（沒在充電）</span>' : ""} · 還沒看的分享 ${d.queueLen} · 待送 ${d.pendingCount} · 版本 ${esc(d.appVersion ?? "—")}</div>`
    : `<div class="warn">這個家庭還沒有開通平板</div>`;

  const pages = w.frame.pages;
  const hiddenKeys = new Set(w.hidden.map((h) => `${h.messageId}:${h.idx}`));
  const slideLabel = (s) => `${s.memberName ?? "家人"}的${s.kind === "video" ? "影片" : "照片"}（${tw(s.sentAt)}）`;
  const cell = (s) => {
    const off = hiddenKeys.has(s.key);
    const img = s.url ? `<img loading="lazy" src="${esc(s.url)}" alt="" />` : `<div style="color:#fff;font-size:12px;padding:6px">沒有縮圖</div>`;
    return `<div class="cell${off ? " off" : ""}">${img}${off ? '<span class="off-tag">已隱藏</span>' : ""}${s.kind === "default" ? "" : moreBtn(s.key, !off, slideLabel(s), s.url)}</div>`;
  };
  const frame = pages.length
    ? `<div class="muted">共 ${pages.length} 頁，每頁輪流顯示；藍框＝最後一次回報時正在顯示的${w.frame.since ? `（${tw(w.frame.since)} 換到這頁）` : ""}。平板不在相框畫面時，這裡是離開相框前的樣子。</div>
       <div class="pages">${pages.map((p, i) => `<div class="page${i === w.frame.index ? " now" : ""}">
          <div class="imgs">${p.map(cell).join("")}</div>
          <div class="cap">${i + 1}. ${i === w.frame.index ? '<span class="tag">正在顯示</span> ' : ""}${p.length === 2 ? "兩張並排 · " : ""}${p[0].kind === "default" ? "預設照片" : `${esc(p[0].memberName ?? "家人")}${p[0].kind === "video" ? "的影片" : ""} · ${tw(p[0].sentAt)}`}</div>
        </div>`).join("")}</div>`
    : `<div class="muted">平板還沒回報相框（裝了新版、進到相框之後一分鐘內會出現）</div>`;

  const listen = w.listen.length
    ? `<div class="muted">點選項「播放訊息」時，照這個順序播放（左右滑會繞一圈）</div>${w.listen.map((m, i) => `<div class="listen">
        ${m.thumbUrl ? `<img loading="lazy" src="${esc(m.thumbUrl)}" alt="" />` : `<div class="ph">${m.kind === "voice" ? "🎙" : "▶"}</div>`}
        <div style="flex:1;min-width:0"><div><b>${i + 1}. ${esc(m.memberName ?? "家人")}</b> 的${KIND[m.kind]}${m.durationMs ? `（${Math.round(m.durationMs / 1000)} 秒）` : ""}</div>
        <div class="muted">${tw(m.sentAt)} 傳的</div>
        ${m.mediaUrl ? (m.kind === "video" ? `<video controls preload="none" playsinline src="${esc(m.mediaUrl)}"></video>` : `<audio controls preload="none" src="${esc(m.mediaUrl)}"></audio>`) : ""}</div>
        ${moreBtn(`${m.id}:0`, true, `${m.memberName ?? "家人"}的${KIND[m.kind]}（${tw(m.sentAt)}）`, m.thumbUrl)}
      </div>`).join("")}`
    : `<div class="muted">播放訊息裡目前沒有東西</div>`;

  const rows = w.log.map((l) => {
    let what;
    if (l.name === "screen_view") what = `畫面換到 <b>${esc(screenName(l.screen))}</b>${l.target ? `<span class="muted">（從 ${esc(screenName(l.target))}）</span>` : ""}`;
    else if (l.name === "ui_swipe") what = `在 ${esc(screenName(l.screen))} <b>${l.dir === "next" ? "往左滑（下一則）" : "往右滑（上一則）"}</b>`;
    else what = `在 ${esc(screenName(l.screen))} 點了 <b>${esc(targetName(l.target))}</b>${l.target === "screen" && l.x !== null ? `<span class="muted">（位置：左右 ${l.x}%、上下 ${l.y}%）</span>` : ""}`;
    const f = focusLabel(w, l.focus);
    return `<tr><td class="t">${tw(l.at)}</td><td>${what}${f ? `<div class="muted">當時：${f}</div>` : ""}</td></tr>`;
  }).join("");
  const log = w.log.length ? `<table>${rows}</table>` : `<div class="muted">還沒有點擊紀錄（裝了新版之後才會有）</div>`;

  const hidden = w.hidden.length
    ? `<div class="muted">平板不會顯示這些（相框、播放訊息、新分享都不出現）；資料沒有刪，按右下角的「⋯」可以取消隱藏</div>${w.hidden.map((h) => `<div class="listen">
        ${h.thumbUrl ? `<img loading="lazy" src="${esc(h.thumbUrl)}" alt="" />` : `<div class="ph">${h.kind === "voice" ? "🎙" : "▶"}</div>`}
        <div style="flex:1;min-width:0"><div><b>${esc(h.memberName ?? "家人")}</b> 的${KIND[h.kind]}${h.kind === "photos" ? ` 第 ${h.idx + 1} 張` : ""}</div>
        <div class="muted">${tw(h.sentAt)} 傳的 · ${tw(h.hiddenAt)} 隱藏</div>
        ${h.mediaUrl ? (h.kind === "video" ? `<video controls preload="none" playsinline src="${esc(h.mediaUrl)}"></video>` : `<audio controls preload="none" src="${esc(h.mediaUrl)}"></audio>`) : ""}
        </div>${moreBtn(`${h.messageId}:${h.idx}`, false, `${h.memberName ?? "家人"}的${KIND[h.kind]}（${tw(h.sentAt)}）`, h.thumbUrl)}
      </div>`).join("")}`
    : `<div class="muted">沒有隱藏的內容。相框或播放訊息裡按右下角的「⋯」可以隱藏，平板一分鐘內就不再顯示（不刪資料）</div>`;

  const counts = w.features[ui.range] ?? {};
  const ranked = Object.entries(counts).filter(([k]) => k !== "missed").sort((a, b) => b[1] - a[1]);
  const max = Math.max(1, ...ranked.map(([, n]) => n), counts.missed ?? 0);
  const barRow = (name, n, cls = "") => `<div class="bar ${cls}"><span>${esc(name)}</span><b>${n}</b><div class="track"><div class="fill" style="width:${Math.round((n / max) * 100)}%"></div></div></div>`;
  const features = `<div class="seg" data-wid="${esc(w.id)}"><button data-range="d7" class="${ui.range === "d7" ? "on" : ""}">近 7 天</button><button data-range="d30" class="${ui.range === "d30" ? "on" : ""}">近 30 天</button></div>
    ${ranked.length || counts.missed ? `${ranked.map(([k, n]) => barRow(featureName(k), n)).join("")}${counts.missed ? barRow(featureName("missed"), counts.missed, "missed") : ""}` : '<div class="muted">這段時間還沒有使用紀錄</div>'}`;

  const stepHtml = (st) => {
    if (st.kind === "screen") return `<span class="step scr">［${esc(SCREENS[st.code] ?? st.code)}］</span>`;
    if (st.kind === "tap") { const [, target] = st.code.split("|"); return `<span class="step">點${esc(targetName(target))}</span>`; }
    if (st.kind === "swipe") { const [, dir] = st.code.split("|"); return `<span class="step">${dir === "prev" ? "往右滑" : "往左滑"}</span>`; }
    return `<span class="step"><i>${esc(EVENT_NAMES[st.code] ?? st.code)}</i></span>`;
  };
  const journeys = w.journeys.length
    ? `<div class="muted">一次使用＝從家人傳來新分享或阿嬤點、滑平板開始，到回相框（或 3 分鐘沒動作）為止。點一下看路徑。</div>${w.journeys.map((j) => {
        const o = j.outcomes;
        const chips = [o.played ? `<span class="chip good">看完 ${o.played}</span>` : "", o.replayed ? `<span class="chip good">重看 ${o.replayed}</span>` : "", o.sent ? `<span class="chip good">說話送出 ${o.sent}</span>` : "", o.listened ? `<span class="chip good">播放訊息</span>` : "", o.abandoned ? `<span class="chip bad">說話沒送出 ${o.abandoned}</span>` : "", o.missedTaps ? `<span class="chip bad">點了沒反應 ${o.missedTaps}</span>` : ""].join("");
        const key = `${w.id}|${j.start}`;
        return `<details class="journey" data-key="${esc(key)}"${ui.open.has(key) ? " open" : ""}><summary><b>${tw(j.start)}</b> · ${esc(triggerName(j.trigger))} · ${dur(j.durationMs)}${chips}</summary>
          <div class="path">${j.steps.map(stepHtml).join(" → ")}</div></details>`;
      }).join("")}`
    : `<div class="muted">最近 30 天還沒有使用紀錄（平板裝了新版之後才有點擊紀錄）</div>`;

  const elder = w.elderNames.length ? w.elderNames.join("、") : w.salutation;
  return `<section class="card">
    <h2>${esc(elder)} 的家${w.paused ? ' <span class="tag">暫停中</span>' : ""}</h2>
    ${dev}
    <h3>相框</h3>${frame}
    <h3>播放訊息</h3>${listen}
    <h3>已隱藏</h3>${hidden}
    <h3>功能使用排行</h3>${features}
    <h3>每次使用的路徑 <span class="muted">（最近 ${w.journeys.length} 次，台灣時間）</span></h3>${journeys}
    <details><summary>點擊與操作紀錄（最近 ${w.log.length} 筆）</summary> ${log}</details>
  </section>`;
}

let timer = null;
async function load() {
  const token = store.get();
  if (!token) return renderLogin();
  const res = await fetch(`${API}/overview`, { headers: { authorization: `Bearer ${token}` } }).catch(() => null);
  if (!res) { app.querySelector("#status") ? (app.querySelector("#status").textContent = "連不上伺服器，稍後自動再試") : renderLogin("連不上伺服器，請稍後再試"); return; }
  if (res.status === 401) { store.set(null); return renderLogin("請重新登入"); }
  if (!res.ok) { renderLogin("伺服器出錯了，請稍後再試"); return; }
  const data = await res.json();
  const y = window.scrollY;
  app.innerHTML = `<header><h1>伴伴監控</h1><button id="r">重新整理</button><button id="o">登出</button></header>
    <main><div class="muted" id="status">資料時間：${tw(data.generatedAt)}（每分鐘自動更新；照片網址 10 分鐘內有效）</div>
    ${data.windows.length ? data.windows.map(renderWindow).join("") : '<div class="card">還沒有家庭</div>'}</main>`;
  window.scrollTo(0, y);
  document.getElementById("r").onclick = load;
  document.getElementById("o").onclick = () => { store.set(null); renderLogin(); };
  clearTimeout(timer);
  // 有影片或語音正在播就不自動更新（不打斷 Founder 聽）
  timer = setTimeout(function tick() {
    const playing = [...document.querySelectorAll("audio, video")].some((m) => !m.paused);
    playing || sheetOpen ? (timer = setTimeout(tick, 60000)) : load();
  }, 60000);
}
load();
</script>
</body>
</html>
